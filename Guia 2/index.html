<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Panadería y Pastelería</title>
    <link rel="stylesheet" href="styloos/estilos.css">
</head>

<body>
    <main>
        <h1>Catálogo de Panadería y Pastelería</h1>

        <section class="catalogo">
            <article class="producto">
                <img src="img/pan-de-yema.jpg" alt="Pan de yema">
                <h3>Pan de yema</h3>
                <p><span class="precio">S/ 0.50</span> la unidad</p>
            </article>

            <article class="producto">
                <img src="img/frances.jpg" alt="Pan francés">
                <h3>Pan francés</h3>
                <p><span class="precio">S/ 0.30</span> la unidad</p>
            </article>

            <article class="producto">
                <img src="img/chancay.jpg" alt="Chancay">
                <h3>Chancay</h3>
                <p><span class="precio">S/ 0.60</span> la unidad</p>
            </article>

            <article class="producto">
                <img src="img/tortadechoocoolate.jpg" alt="Torta de chocolate">
                <h3>Torta de chocolate</h3>
                <p><span class="precio">S/ 45.00</span> entera</p>
            </article>
        </section>
    </main>
</body>

</html>
